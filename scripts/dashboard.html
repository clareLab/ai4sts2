<script>
(function () {
  "use strict";
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const fmt = (v, d = 0) => v == null || Number.isNaN(v) ? "–" : Number(v).toLocaleString("en-US", { maximumFractionDigits: d, minimumFractionDigits: d });
  const usParts = (v) => v == null ? { value: "–", unit: "" } : v >= 10000 ? { value: fmt(v / 1000, 1), unit: "ms" } : { value: fmt(v, v < 100 ? 1 : 0), unit: "µs" };
  const fmtUs = (v) => { const p = usParts(v); return p.unit ? `${p.value} ${p.unit}` : p.value; };
  const short = (ts) => ts ? ts.slice(5, 16).replace("T", " ") : "";
  const clock = (ts) => ts ? ts.slice(11, 19) : "";
  const human = (id) => String(id || "").toLowerCase().split("_").map((w) => w ? w[0].toUpperCase() + w.slice(1) : "").join(" ");
  const WINDOWS = [{ key: "all", label: "全部", n: Infinity }, { key: "50", label: "最近 50 次", n: 50 }, { key: "20", label: "最近 20 次", n: 20 }, { key: "5", label: "最近 5 次", n: 5 }];

  const embedded = JSON.parse(document.getElementById("data").textContent);
  const store = { live: !embedded, index: embedded ? embedded.index : [], status: embedded ? embedded.status : null, runs: new Map(Object.entries(embedded ? embedded.runs || {} : {})), loading: new Map() };

  async function fetchJson(path) {
    const r = await fetch(path, { cache: "no-store" });
    if (!r.ok) throw new Error(`${path}: ${r.status}`);
    return r.json();
  }
  async function loadRun(id) {
    if (store.runs.has(id)) return store.runs.get(id);
    if (!store.loading.has(id)) {
      store.loading.set(id, fetchJson(`data/runs/${id}.json`).then((run) => { store.runs.set(id, run); store.loading.delete(id); return run; }).catch((e) => { store.loading.delete(id); throw e; }));

    const encs = models.encounters;
    const cardsVerified = ironclad.filter((c) => (D.cards[c.id] || {}).n > 0).length;
    const encVerified = encs.filter((e) => (D.encounters[e.id] || {}).n > 0).length;
    const patches = lb ? lb.patches : null;
    const lbLink = lb ? href("/run/" + lb.id, f) : null;
    const usTile = (label, key, cls) => { const p = usParts(m(lb, key)); return tile(label, p.value, p.unit, deltaOf(m(lb, key), m(pb, key), true, fmtUs), sparkline(D.benches.map((b) => m(b, key)).slice(-12), cls), lbLink); };
    const tiles = [
      usTile("出牌 中位", "plays", "f1"), usTile("结束回合 中位", "endTurns", "f2"), usTile("开局 中位", "starts", "f3"),
      tile("分配 / 动作", fmt(kb(lb), 0), "KB", deltaOf(kb(lb), kb(pb), true, (v) => fmt(v, 0) + " KB"), sparkline(D.benches.map(kb).slice(-12), "f1"), lbLink),
      tile("已验证牌", `${cardsVerified}<small>/ ${ironclad.length || "?"}</small>`, "", { cls: "", text: `${Object.keys(D.cards).length} 种打出过` }, "", href("/cards", f)),
      tile("已验证遭遇", `${encVerified}<small>/ ${encs.length || "?"}</small>`, "", { cls: "", text: `${D.seeds.size} 个种子` }, "", href("/encounters", f)),
    ].join("");
    const S = D.solveStats;
    const solveTiles = S.cases ? [
      tile("自对弈胜率", `${fmt((S.won / S.cases) * 100, 0)}<small>%</small>`, "", { cls: "", text: `${S.won} / ${S.cases} 场 · ${S.runs} 次运行` }, "", href("/runs", f, { kind: "solve" })),
      tile("每回合搜索", `${fmt(S.searches ? S.millis / S.searches : null, 0)}<small>ms</small>`, "", { cls: "", text: `${fmt(S.searches ? S.nodes / S.searches : null, 0)} 节点/回合` }, "", href("/runs", f, { kind: "solve" })),
      tile("搜索总节点", fmt(S.nodes), "", { cls: "", text: `${fmt(S.millis / 1000, 1)} s` }, "", href("/runs", f, { kind: "solve" })),
    ].join("") : "";
    const R = D.runStats;
    const runTiles = R.cases ? [
      tile("整局过关", `${fmt((R.act2 / R.cases) * 100, 0)}<small>% 过两幕</small>`, "", { cls: "", text: `Act1 ${R.act1} · Act2 ${R.act2} · 通关 ${R.act3} / ${R.cases} 局` }, "", href("/runs", f, { kind: "run" })),
      tile("平均层数", fmt(R.floors / R.cases, 1), "", { cls: "", text: `${R.runs} 次运行` }, "", href("/runs", f, { kind: "run" })),
    ].join("") : "";
    const lw = D.warmups[D.warmups.length - 1] || null;
    const curve = lw && lw.result && lw.result.millisPerRound ? lw.result.millisPerRound : null;
    const colFig = curve
      ? figureWithTable("warm", "热身曲线", `<span>每批 ${lw.rounds} 场的均值 ms/场，批间空闲 ${lw.idle} s · <a href="${href("/run/" + lw.id, f)}">详情</a></span>`, columns(curve, "ms", "批"), columnsTable(curve, "ms/场", "批"))
      : `<figure><header><h2>热身曲线</h2></header><div class="empty">窗口内没有热身记录 — 跑 <code>just warmup</code></div></figure>`;
    const diffRows = D.diffs.slice().reverse().map((d) => `<tr><td class="muted"><a href="${href("/run/" + d.id, f)}">${short(d.ts)}</a></td><td class="id wrap">${d.encounters.map((e) => `<a href="${href("/encounter/" + e, f)}">${esc(e)}</a>`).join(", ")}</td><td class="id">${d.seeds.map(esc).join(", ")}</td><td class="num">${d.deck.length || "起始"}</td><td class="num">${fmt(d.steps)}</td><td class="num">${Object.keys(d.played || {}).length}</td><td>${state(d.mismatches > 0, d.steps)}</td><td class="num">${fmt(d.wallSeconds, 0)} s</td><td><a class="btn" href="${href("/run/" + d.id, f)}">回放</a></td></tr>`).join("");
    const benchRows = D.benches.slice().reverse().map((b) => { const r = b.result, e = r.endTurns || {}, s = r.starts || {}; return `<tr><td class="muted"><a href="${href("/run/" + b.id, f)}">${short(b.ts)}</a></td><td class="id"><a href="${href("/encounter/" + b.encounter, f)}">${esc(b.encounter)}</a></td><td class="num">${b.rounds}</td><td class="num">${fmt(r.plays.median, 0)}</td><td class="num">${fmt(r.plays.p95, 0)}</td><td class="num">${fmt(e.median, 0)}</td><td class="num">${fmt(e.p95, 0)}</td><td class="num">${fmt(s.median, 0)}</td><td class="num">${fmt(s.p95, 0)}</td><td class="num">${fmt(D.perAction(b) / 1024, 0)}</td><td class="num">${fmt(r.allocatedBytes / 1e6, 0)}</td><td class="num">${fmt(r.totalMillis / 1000, 1)} s</td><td class="num">${r.gc ? `${r.gc.gen0}/${r.gc.gen1}/${r.gc.gen2}` : "–"}</td><td class="num">${b.patches ?? "–"}</td></tr>`; }).join("");
    return `${filterBar(route, f)}
      <section class="lead">
        <a class="hero" href="${href("/runs", f, { kind: "diff" })}"><div class="label">累计不一致</div><div class="value ${D.mism ? "bad" : ""}">${fmt(D.mism)}</div><div class="sub">工作台 vs 真实流程 · <b>${fmt(D.steps)}</b> 步差分 · <b>${D.diffs.length}</b> 次运行<br>拦截点 <b>${patches == null ? "–" : fmt(patches)}</b> / 500 门禁</div></a>
        <div class="tiles">${tiles}${solveTiles}${runTiles}</div>
      </section>
      <section class="row2">
        ${figureWithTable("perf", "性能趋势", `<span class="legend"><span><i style="background:var(--s1)"></i>出牌</span><span><i style="background:var(--s2)"></i>结束回合（含敌方回合）</span><span><i style="background:var(--s3)"></i>开局</span></span><span>每次 bench 的中位 µs，对数轴 · 点一个点打开那次</span>`, logChart(D.benches, f), perfTable(D.benches))}
        ${colFig}
      </section>
      <section class="row2 even">
        ${coverage("cards", "Ironclad 牌覆盖", ironclad, D.cards, f, "card", cardTip, cardCols, modelsHint(models, "牌池"))}
        ${coverage("encs", "遭遇覆盖", encs, D.encounters, f, "encounter", encTip, encCols, modelsHint(models, "遭遇"))}
      </section>
      <figure><header><h2>差分历史</h2><div class="cap">窗口内 ${D.diffs.length} 次 · <a href="${href("/runs", f, { kind: "diff" })}">全部</a></div></header><div class="tablewrap"><table><thead><tr><th>时间</th><th>遭遇</th><th>种子</th><th class="num">卡组</th><th class="num">步数</th><th class="num">牌种</th><th>结果</th><th class="num">耗时</th><th></th></tr></thead><tbody>${diffRows || `<tr><td colspan="9" class="empty">窗口内没有差分记录</td></tr>`}</tbody></table></div></figure>
      <figure><header><h2>Bench 历史</h2><div class="cap">窗口内 ${D.benches.length} 次 · 时间单位 µs · <a href="${href("/runs", f, { kind: "bench" })}">全部</a></div></header><div class="tablewrap"><table><thead><tr><th>时间</th><th>遭遇</th><th class="num">场数</th><th class="num">出牌中位</th><th class="num">出牌 p95</th><th class="num">结束回合中位</th><th class="num">结束回合 p95</th><th class="num">开局中位</th><th class="num">开局 p95</th><th class="num">KB/动作</th><th class="num">分配 MB</th><th class="num">总耗时</th><th class="num">GC 0/1/2</th><th class="num">拦截点</th></tr></thead><tbody>${benchRows || `<tr><td colspan="14" class="empty">窗口内没有 bench 记录</td></tr>`}</tbody></table></div></figure>`;
  }

  function runSummaryCells(r, f) {
    if (r.kind === "diff") return `${r.encounters.length} 遭遇 × ${r.seeds.length} 种子 · ${fmt(r.steps)} 步 · ${state(r.mismatches > 0, r.steps)}`;
    if (r.kind === "solve") return `${r.encounters.length} 遭遇 × ${r.seeds.length} 种子 · 胜 ${r.won}/${(r.cases || []).length} · ${fmt(r.nodes)} 节点 · ${fmt(r.searchMillis / 1000, 1)} s 搜索 · ${r.verified ? state(r.mismatches > 0, r.steps) : "未核对"}`;
    if (r.kind === "bench") return `${esc(r.encounter)} × ${r.rounds} · 出牌 ${fmtUs((r.result || {}).plays && r.result.plays.median)} · 结束回合 ${fmtUs(((r.result || {}).endTurns || {}).median)}`;
    if (r.kind === "warmup") return `${esc(r.encounter)} · ${r.batches} × ${r.rounds} 场 · 末批 ${fmt((r.result.millisPerRound || []).slice(-1)[0], 2)} ms/场`;
    if (r.kind === "models") return `${r.cards} 张牌 · ${r.encounters} 个遭遇`;
    if (r.kind === "run") return `${r.seeds.length} 种子 · ${r.floors} 层 · 通关 ${r.cleared} · 阵亡 ${r.died} · ${fmt(r.wallSeconds, 0)} s`;
    if (r.kind === "pair") return `${r.fights} 场 · A 胜 ${r.winsA} / HP ${r.hpA} · B 胜 ${r.winsB} / HP ${r.hpB} · 更差 ${(r.worse || []).length} 更好 ${(r.better || []).length}`;
    return "";
  }
  const KINDS = { diff: "差分", solve: "自对弈", run: "整局", pair: "配对对比", bench: "Bench", warmup: "热身", models: "模型快照" };
  const ROOM_TEXT = { Monster: "普通战", Elite: "精英", Boss: "Boss", RestSite: "篝火", Shop: "商店", Treasure: "宝箱", Unknown: "未知", Ancient: "远古", Unassigned: "起点" };

  function pageRuns(route, f) {
    const kind = route.q.get("kind") || "all";
    const rows = inWindow(inVersion(store.index, f).filter((r) => kind === "all" || r.kind === kind), f).slice().reverse();
    const tabs = ["all", "diff", "solve", "run", "pair", "bench", "warmup", "models"].map((k) => `<a href="${href("/runs", f, { kind: k === "all" ? null : k })}" aria-current="${k === kind}">${k === "all" ? "全部" : KINDS[k]}</a>`).join("");
    const body = rows.map((r) => `<tr><td class="muted"><a href="${href("/run/" + r.id, f)}">${short(r.ts)}</a></td><td>${KINDS[r.kind] || esc(r.kind)}</td><td>${runSummaryCells(r, f)}</td><td class="id">${esc(r.game || "?")}</td><td class="id"><a href="${href("/run/" + r.id, f)}">${esc(r.id)}</a></td></tr>`).join("");
    return `${filterBar(route, f)}<div class="panel"><header><h2>运行记录</h2><div class="cap"><span class="seg">${tabs}</span><span>窗口内 ${rows.length} 条</span></div></header><div class="tablewrap"><table><thead><tr><th>时间</th><th>类型</th><th>摘要</th><th>游戏版本</th><th>ID</th></tr></thead><tbody>${body || `<tr><td colspan="5" class="empty">没有记录</td></tr>`}</tbody></table></div></div>`;
  }

  function cardChip(c, f, extraCls) {
    const cost = c.costsX ? "X" : c.cost;
    const badge = cost === "" || cost == null ? "" : `<span class="cost ${c.costsX ? "x" : cost === 0 ? "zero" : ""}">${cost}</span>`;
    return `<a class="card ${extraCls || ""}" href="${href("/card/" + c.id, f)}" title="${esc(c.id)}">${badge}${esc(human(c.id))}${c.upgrade ? `<span class="up">+${c.upgrade > 1 ? c.upgrade : ""}</span>` : ""}</a>`;
  }
  function kv(pairs) { return `<dl class="kv">${pairs.filter((p) => p[1] != null && p[1] !== "").map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl>`; }
  const crumbs = (items) => `<div class="crumbs">${items.map((it, i) => it.href ? `<a href="${it.href}">${it.text}</a>${i < items.length - 1 ? "<span>›</span>" : ""}` : `<span>${it.text}</span>`).join("")}</div>`;

  async function pageRun(route, f) {
    const id = route.parts[1];
    const row = store.index.find((r) => r.id === id);
    let run = null, failed = false;
    try { run = await loadRun(id); } catch (e) { failed = true; }
    if (!row && !run) return failed ? loadFail(id, f) : `<div class="empty">找不到运行记录 <code>${esc(id)}</code></div>`;
    if (failed && row && row.replay) return loadFail(id, f);
    const r = run || row;
    const head = `${crumbs([{ text: "总览", href: href("/", f) }, { text: "运行记录", href: href("/runs", f, { kind: r.kind }) }, { text: KINDS[r.kind] || r.kind }])}<h1>${KINDS[r.kind] || esc(r.kind)} · ${short(r.ts)}<span class="id">${esc(r.id)}</span></h1>`;
    const meta = kv([["游戏版本", esc(r.game || "?")], ["mod", esc(r.mod || "?")], ["commit", esc((r.build || {}).commit || "未提交")], ["mod 构建", short((r.build || {}).modBuilt)], ["记录格式", r.schema || 1]]);
    const models = await modelsFor(derive(store.index, f));
    if (r.kind === "diff" || r.kind === "solve") {
      const cases = (run && run.detail && run.detail.cases) || r.cases || [];
      const isSolve = r.kind === "solve";
      const hasTrace = cases.some((c) => c.steps && Array.isArray(c.steps));
      const nsteps = (c) => Array.isArray(c.steps) ? c.steps.length : c.steps;
      const rows = cases.map((c, ci) => `<tr><td class="num">${ci + 1}</td><td class="id"><a href="${href("/encounter/" + c.encounter, f)}">${esc(c.encounter)}</a></td><td class="id">${esc(c.seed)}</td><td class="num">${nsteps(c)}</td><td class="num">${c.turns ?? "–"}</td><td>${outcomeText[c.outcome] || (c.mismatches ? "不一致" : "–")}</td><td class="num">${c.hpLeft ?? "–"}</td><td class="num">${Object.keys(c.played || {}).length}</td><td>${isSolve && !r.verified ? `<span class="muted">未核对</span>` : state(c.mismatches > 0, nsteps(c))}</td>${isSolve ? `<td class="num">${fmt(c.nodes)}</td><td class="num">${fmt(c.searchMillis, 0)}</td>` : ""}<td class="num">${fmt(c.wallSeconds, 0)} s</td><td>${Array.isArray(c.steps) ? `<a class="btn" href="${href(`/run/${r.id}/${ci}/0`, f)}">回放</a>` : `<span class="muted">无回放数据</span>`}</td></tr>`).join("");
      const params = isSolve
        ? kv([["角色", esc(r.character)], ["遭遇", r.encounters.map((e) => `<a href="${href("/encounter/" + e, f)}">${esc(e)}</a>`).join(", ")], ["种子", r.seeds.map(esc).join(", ")], ["搜索预算", `${fmt(r.maxNodes)} 节点 · 深度 ${r.maxDepth}`], ["核对", r.verified ? "真实流程逐步核对" : "未核对"], ["拦截点", r.patches ?? "–"], ["战绩", `胜 ${r.won} · 负 ${r.lost} · 共 ${(r.cases || []).length}`], ["搜索", `${fmt(r.nodes)} 节点 · ${fmt(r.searchMillis / 1000, 1)} s`], ["总步数", `${fmt(r.steps)} · 不一致 ${fmt(r.mismatches)}`], ["耗时", `${fmt(r.wallSeconds, 0)} s`]])
        : kv([["角色", esc(r.character)], ["遭遇", r.encounters.map((e) => `<a href="${href("/encounter/" + e, f)}">${esc(e)}</a>`).join(", ")], ["种子", r.seeds.map(esc).join(", ")], ["策略", esc(r.policy) + (r.randomSeed != null ? ` (seed ${r.randomSeed})` : "")], ["最大步数", r.maxSteps], ["恢复探针", r.restore ? `每 ${r.restore.every} 步 · 绕行 ${r.restore.detour} 步` : "无"], ["oracle", r.oracle ? `${esc(r.oracle.game)} · FastMode ${esc(r.oracle.fastMode)}` : "–"], ["拦截点", r.patches ?? "–"], ["总步数", `${fmt(r.steps)} · 不一致 ${fmt(r.mismatches)}`], ["耗时", `${fmt(r.wallSeconds, 0)} s`]]);
      return `${head}<div class="row2"><div class="panel"><header><h2>参数</h2></header>${params}</div><div class="panel"><header><h2>记录</h2></header>${meta}</div></div>
        <div class="panel"><header><h2>卡组</h2><div class="cap">${r.deck.length ? r.deck.length + " 张" : "角色起始卡组"}</div></header><div class="chips">${r.deck.map((spec) => { const plus = spec.indexOf("+"); const cid = plus < 0 ? spec : spec.slice(0, plus); const m = models.cards.find((c) => c.id === cid); return cardChip({ id: cid, cost: m ? m.cost : "", costsX: m ? m.costsX : false, upgrade: plus < 0 ? 0 : (spec.length === plus + 1 ? 1 : parseInt(spec.slice(plus + 1), 10) || 1) }, f); }).join("") || `<span class="muted">起始卡组</span>`}</div></div>
        <div class="panel"><header><h2>对局</h2><div class="cap">${cases.length} 场${hasTrace ? "" : " · 这次运行早于回放记录功能"}</div></header><div class="tablewrap"><table><thead><tr><th class="num">#</th><th>遭遇</th><th>种子</th><th class="num">步数</th><th class="num">回合</th><th>结果</th><th class="num">剩余 HP</th><th class="num">牌种</th><th>一致性</th>${isSolve ? `<th class="num">节点</th><th class="num">搜索 ms</th>` : ""}<th class="num">耗时</th><th></th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
    }
    if (r.kind === "run") {
      const cases = (run && run.detail && run.detail.cases) || r.cases || [];
      const params = kv([["角色", esc(r.character)], ["玩家", r.players || 1], ["种子", r.seeds.map(esc).join(", ")], ["搜索预算", `${fmt(r.maxNodes)} 节点 · 深度 ${r.maxDepth} · 束 ${r.beam} · 前瞻 ${r.turns} 回合`], ["奖励推演", `${r.fights} 场${r.boss ? ` + Boss ${r.bossTurns} 回合` : ""}${r.paths ? " · 路径推演" : ""}`], ["Boss 搜索", r.bossSearch ? `${fmt(r.bossSearch.maxNodes)} 节点 · 束 ${r.bossSearch.beam} · 前瞻 ${r.bossSearch.turns}` : "同普通战"], ["拦截点", r.patches ?? "–"], ["层数", fmt(r.floors)], ["结局", `通关 ${r.cleared} · 阵亡 ${r.died} · 出错 ${r.errors}`], ["耗时", `${fmt(r.wallSeconds, 0)} s`]]);
      const runOutcome = { died: "阵亡", "act-cleared": "通关本幕", stuck: "卡住", running: "未打完", error: "出错" };
      const blocks = cases.map((c, ci) => {
        const floors = c.floorsDetail || [];
        const hpPts = floors.map((fl) => fl.hpAfter);
        const rows = floors.map((fl) => {
          const combat = fl.combat ? `${fl.combat.won ? "胜" : "败"} · ${fl.combat.turns} 回合 · ${fmt(fl.combat.nodes)} 节点 · ${fmt(fl.combat.millis, 0)} ms` : "";
          const took = (fl.taken || []).map((t) => t.kind === "card" ? (t.card ? `<a class="card" href="${href("/card/" + t.card, f)}">${esc(human(t.card))}</a>` : `<span class="muted">跳过卡牌</span>`) : `<span class="power">${t.kind === "gold" ? "+" + t.value + " 金" : esc(human(String(t.value)))}</span>`).join(" ");
          const ev = fl.evaluation ? `<details class="pile"><summary>推演 ${fl.evaluation.options.length} 个选项 · 最佳 <b>${esc(human(fl.evaluation.best))}</b> · ${fmt(fl.evaluation.micros / 1000, 0)} ms</summary><div class="tablewrap"><table><thead><tr><th>选项</th><th class="num">胜场</th><th class="num">失血</th><th class="num">Boss 伤害</th><th class="num">得分</th><th>逐场</th></tr></thead><tbody>${fl.evaluation.options.map((o) => `<tr class="${o.label === fl.evaluation.best ? "best" : ""}"><td>${esc(human(o.label))}</td><td class="num">${o.rollout.wins}/${o.rollout.fights}</td><td class="num">${o.rollout.hpLost}</td><td class="num">${o.rollout.bossDamage ?? "–"}</td><td class="num">${fmt(o.rollout.score, 0)}</td><td class="id">${o.rollout.details.map((d) => `${esc(human(d.encounter))} ${d.won ? "胜" : "败"} ${d.hpBefore}→${d.hpAfter}`).join(" · ")}</td></tr>`).join("")}</tbody></table></div></details>` : "";
          const rest = fl.rest ? `<span class="power">${esc(human(fl.rest.option))}${fl.rest.upgraded ? " → " + esc(human(fl.rest.upgraded)) : ""}</span>` : "";
          const evt = fl.event ? `<span class="muted">${(fl.event.chosen || []).map((k) => esc(human(String(k).split(".").pop()))).join(" › ") || "无选项"}</span>` : "";
          const chest = fl.treasure ? `<span class="power">${fl.treasure.picked ? esc(human(fl.treasure.picked)) : "未拿遗物"}</span><span class="muted"> 备选 ${(fl.treasure.offered || []).map((r) => esc(human(r))).join(", ")}</span>` : "";
          const shop = fl.shop ? `${(fl.shop.bought || []).map((b) => `<span class="power">${esc(human(b.label || b.id || b.card || b.kind))} · ${b.cost} 金</span>`).join(" ") || `<span class="muted">未购买</span>`}${(fl.shopEvaluations || []).map((ev, k) => `<details class="pile"><summary>商店推演 ${k + 1} · 最佳 <b>${esc(human(ev.best))}</b> · ${fmt(ev.micros / 1000, 0)} ms</summary><div class="tablewrap"><table><thead><tr><th>选项</th><th class="num">胜场</th><th class="num">失血</th><th class="num">Boss 伤害</th><th class="num">得分</th></tr></thead><tbody>${ev.options.map((o) => `<tr class="${o.label === ev.best ? "best" : ""}"><td>${esc(human(o.label))}</td><td class="num">${o.rollout.wins}/${o.rollout.fights}</td><td class="num">${o.rollout.hpLost}</td><td class="num">${o.rollout.bossDamage ?? "–"}</td><td class="num">${fmt(o.rollout.score, 0)}</td></tr>`).join("")}</tbody></table></div></details>`).join("")}` : "";
          const pathEv = fl.pathEvaluation && fl.pathEvaluation.options ? `<details class="pile"><summary>路径推演 ${fl.pathEvaluation.options.length} 个去向 · ${fmt(fl.pathEvaluation.micros / 1000, 0)} ms</summary><div class="tablewrap"><table><thead><tr><th>去向</th><th>房间</th><th class="num">HP</th><th class="num">金币</th><th class="num">牌</th><th class="num">遗物</th><th class="num">药水</th><th class="num">得分</th></tr></thead><tbody>${fl.pathEvaluation.options.map((o) => `<tr class="${fl.pathEvaluation.best && o.choice.col === fl.pathEvaluation.best.col && o.choice.row === fl.pathEvaluation.best.row ? "best" : ""}"><td>${ROOM_TEXT[o.choice.type] || esc(o.choice.type)} (${o.choice.col},${o.choice.row})</td><td class="id">${esc(human(o.room || "?"))}${o.error ? ` <span class="state fail">出错</span>` : ""}</td><td class="num">${o.hp}</td><td class="num">${o.gold}</td><td class="num">${o.deck}</td><td class="num">${o.relics}</td><td class="num">${o.potions}</td><td class="num">${fmt(o.score, 0)}</td></tr>`).join("")}</tbody></table></div></details>` : "";
          const trace = fl.combat && (fl.combat.trace || []).length ? `<details class="pile"><summary>逐回合 ${fl.combat.trace.length} 回合</summary><div class="tablewrap"><table><thead><tr><th class="num">回合</th><th class="num">我方 HP</th><th class="num">敌方 HP</th><th class="num">得分</th><th class="num">节点</th><th>动作</th></tr></thead><tbody>${fl.combat.trace.map((t) => `<tr><td class="num">${t.turn}</td><td class="num">${(t.playerHp || []).join("/")}</td><td class="num">${(t.enemyHp || []).join("/")}</td><td class="num">${fmt(t.score, 0)}</td><td class="num">${fmt(t.nodes)}</td><td class="id">${(t.line || []).map((a) => a.kind === "end" ? "结束" : (a.kind === "potion" ? "药水 " : "") + human(a.card) + (a.target != null ? "→" + (a.target + 1) : "")).map(esc).join(" › ")}</td></tr>`).join("")}</tbody></table></div></details>` : "";
          return `<tr><td class="num">${fl.floor}</td><td>${ROOM_TEXT[fl.type] || esc(fl.type)}</td><td class="id">${fl.model ? (fl.combat ? `<a href="${href("/encounter/" + fl.model, f)}">${esc(human(fl.model))}</a>` : esc(human(fl.model))) : esc(fl.room)}</td><td class="num">${fl.hpBefore} → <b>${fl.hpAfter}</b></td><td>${combat}${trace}</td><td>${pathEv}${took}${rest}${evt}${chest}${shop}${ev}</td><td class="num">${fl.deckSize ?? "–"}</td><td class="num">${fl.gold ?? "–"}</td><td class="num">${fmt(fl.wallSeconds, 1)} s</td></tr>`;
        }).join("");
        const spark = hpPts.length ? `<svg viewBox="0 0 ${Math.max(1, hpPts.length - 1) * 24 + 8} 60" class="spark" role="img" aria-label="HP 曲线"><polyline fill="none" stroke="var(--s1)" stroke-width="2" points="${hpPts.map((h, i) => `${4 + i * 24},${56 - (h / Math.max(1, c.maxHp || 80)) * 52}`).join(" ")}"/>${hpPts.map((h, i) => `<circle cx="${4 + i * 24}" cy="${56 - (h / Math.max(1, c.maxHp || 80)) * 52}" r="2.5" fill="var(--s1)"><title>第 ${floors[i].floor} 层 HP ${h}</title></circle>`).join("")}</svg>` : "";
        const deck = (c.deck || []).map((spec) => { const plus = spec.indexOf("+"); const cid = plus < 0 ? spec : spec.slice(0, plus); const m = models.cards.find((x) => x.id === cid); return cardChip({ id: cid, cost: m ? m.cost : "", costsX: m ? m.costsX : false, upgrade: plus < 0 ? 0 : (parseInt(spec.slice(plus + 1), 10) || 1) }, f); }).join("");
        return `<div class="panel"><header><h2>种子 ${esc(c.seed)}</h2><div class="cap">${runOutcome[c.outcome] || esc(c.outcome)} · ${c.floors} 层 · HP ${c.hpLeft ?? "?"}/${c.maxHp ?? "?"} · 金币 ${c.gold ?? "?"} · 战斗 ${c.won ?? 0}/${c.combats ?? 0} · ${fmt(c.nodes)} 节点 · ${fmt(c.wallSeconds, 0)} s${c.error ? ` · <span class="state fail">${esc(c.error.slice(0, 120))}</span>` : ""}</div></header>${spark}<div class="tablewrap"><table><thead><tr><th class="num">层</th><th>房间</th><th>内容</th><th class="num">HP</th><th>战斗</th><th>决策</th><th class="num">卡组</th><th class="num">金币</th><th class="num">耗时</th></tr></thead><tbody>${rows || `<tr><td colspan="9" class="empty">没有楼层记录</td></tr>`}</tbody></table></div><div class="cap" style="margin-top:8px">最终卡组 ${(c.deck || []).length} 张 · 遗物 ${(c.relics || []).map((x) => `<span class="power">${esc(human(x))}</span>`).join(" ")}</div><div class="chips">${deck}</div></div>`;
      }).join("");
      return `${head}<div class="row2"><div class="panel"><header><h2>参数</h2></header>${params}</div><div class="panel"><header><h2>记录</h2></header>${meta}</div></div>${blocks}`;
    }
    if (r.kind === "pair") {
      const rows = (run && run.detail && run.detail.rows) || r.rows || [];
      const cfg = (c) => Object.entries(c || {}).map(([k, v]) => `${k}=${v}`).join(" ");
      const params = kv([["角色", esc(r.character)], ["遭遇", r.encounters.map((e) => `<a href="${href("/encounter/" + e, f)}">${esc(e)}</a>`).join(", ")], ["种子", r.seeds.map(esc).join(", ")], ["卡组", r.deck.length ? r.deck.length + " 张" : "起始卡组"], ["药水", (r.potions || []).map(human).map(esc).join(", ") || "无"], ["A", esc(cfg(r.configs.a))], ["B", esc(cfg(r.configs.b))], ["A 战绩", `胜 ${r.winsA}/${r.fights} · 总 HP ${r.hpA} · ${fmt(r.millisA / 1000, 1)} s`], ["B 战绩", `胜 ${r.winsB}/${r.fights} · 总 HP ${r.hpB} · ${fmt(r.millisB / 1000, 1)} s`], ["B 更差 (≥10 HP)", (r.worse || []).map(esc).join(", ") || "无"], ["B 更好 (≥10 HP)", (r.better || []).map(esc).join(", ") || "无"], ["耗时", `${fmt(r.wallSeconds, 0)} s`]]);
      const body = rows.map((x) => `<tr><td class="id"><a href="${href("/encounter/" + x.encounter, f)}">${esc(human(x.encounter))}</a></td><td class="id">${esc(x.seed)}</td><td>${x.a.won ? "胜" : "负"}</td><td class="num">${x.a.hp}</td><td class="num">${x.a.turns}</td><td class="num">${fmt(x.a.nodes)}</td><td class="num">${fmt(x.a.millis, 0)}</td><td>${x.b.won ? "胜" : "负"}</td><td class="num">${x.b.hp}</td><td class="num">${x.b.turns}</td><td class="num">${fmt(x.b.nodes)}</td><td class="num">${fmt(x.b.millis, 0)}</td><td class="num"><b>${x.b.hp - x.a.hp > 0 ? "+" : ""}${x.b.hp - x.a.hp}</b></td></tr>`).join("");
      return `${head}<div class="row2"><div class="panel"><header><h2>参数</h2></header>${params}</div><div class="panel"><header><h2>记录</h2></header>${meta}</div></div><div class="panel"><header><h2>逐场对比</h2><div class="cap">同一卡组同一种子，A 与 B 各打一次</div></header><div class="tablewrap"><table><thead><tr><th>遭遇</th><th>种子</th><th>A</th><th class="num">HP</th><th class="num">回合</th><th class="num">节点</th><th class="num">ms</th><th>B</th><th class="num">HP</th><th class="num">回合</th><th class="num">节点</th><th class="num">ms</th><th class="num">ΔHP</th></tr></thead><tbody>${body}</tbody></table></div></div>`;
    }
    if (r.kind === "bench") {
      const res = (run && run.detail && run.detail.result) || r.result;
      const stats = ["starts", "plays", "endTurns"].map((k) => { const v = res[k] || {}; return v.count ? `<tr><td>${{ starts: "开局", plays: "出牌", endTurns: "结束回合" }[k]}</td><td class="num">${fmt(v.count)}</td><td class="num">${fmt(v.median, 1)}</td><td class="num">${fmt(v.p95, 1)}</td><td class="num">${fmt(v.min, 1)}</td><td class="num">${fmt(v.max, 1)}</td></tr>` : ""; }).join("");
      const bucket = res.bucketMillisPerRound || [];
      return `${head}<div class="row2"><div class="panel"><header><h2>参数</h2></header>${kv([["实例", esc(r.instance)], ["角色", esc(r.character)], ["遭遇", `<a href="${href("/encounter/" + r.encounter, f)}">${esc(r.encounter)}</a>`], ["种子", esc(r.seed)], ["场数", r.rounds], ["分桶", `${r.bucket} 场/桶`], ["拦截点", r.patches ?? "–"], ["总耗时", `${fmt(res.totalMillis / 1000, 2)} s`], ["分配", `${fmt(res.allocatedBytes / 1e6, 0)} MB`], ["GC 0/1/2", res.gc ? `${res.gc.gen0}/${res.gc.gen1}/${res.gc.gen2}` : "–"], ["Pump", res.pump ? `posted ${res.pump.posted} · drained ${res.pump.drained}` : "–"], ["选牌点", res.selector ?? "–"]])}</div><div class="panel"><header><h2>记录</h2></header>${meta}</div></div>
        <div class="panel"><header><h2>动作耗时</h2><div class="cap">µs</div></header><div class="tablewrap"><table><thead><tr><th>动作</th><th class="num">次数</th><th class="num">中位</th><th class="num">p95</th><th class="num">最小</th><th class="num">最大</th></tr></thead><tbody>${stats}</tbody></table></div></div>
        ${bucket.length ? figureWithTable("bucket", "分桶耗时", `<span>每 ${r.bucket} 场一桶，ms/场</span>`, columns(bucket, "ms", "桶"), columnsTable(bucket, "ms/场", "桶")) : ""}`;
    }
    if (r.kind === "warmup") {
      const curve = (r.result || {}).millisPerRound || [];
      return `${head}<div class="row2"><div class="panel"><header><h2>参数</h2></header>${kv([["实例", esc(r.instance)], ["遭遇", `<a href="${href("/encounter/" + r.encounter, f)}">${esc(r.encounter)}</a>`], ["批次", `${r.batches} × ${r.rounds} 场`], ["批间空闲", `${r.idle} s`], ["总耗时", `${fmt(r.wallSeconds, 0)} s`]])}</div><div class="panel"><header><h2>记录</h2></header>${meta}</div></div>${figureWithTable("warm", "热身曲线", `<span>ms/场</span>`, columns(curve, "ms", "批"), columnsTable(curve, "ms/场", "批"))}`;
    }
    if (r.kind === "models") {

      const pools = {}; det.cards.forEach((c) => { pools[c.pool] = (pools[c.pool] || 0) + 1; });
      return `${head}<div class="panel"><header><h2>记录</h2></header>${meta}</div><div class="row2 even"><div class="panel"><header><h2>牌池</h2><div class="cap">${det.cards.length} 张</div></header><div class="tablewrap"><table><thead><tr><th>牌池</th><th class="num">张数</th></tr></thead><tbody>${Object.entries(pools).sort().map(([p, n]) => `<tr><td class="id">${esc(p)}</td><td class="num">${n}</td></tr>`).join("")}</tbody></table></div></div><div class="panel"><header><h2>遭遇</h2><div class="cap">${det.encounters.length} 个 · <a href="${href("/encounters", f)}">覆盖页</a></div></header><div class="tablewrap"><table><thead><tr><th>ID</th><th>类型</th></tr></thead><tbody>${det.encounters.map((e) => `<tr><td class="id"><a href="${href("/encounter/" + e.id, f)}">${esc(e.id)}</a></td><td>${esc(e.type)}</td></tr>`).join("")}</tbody></table></div></div></div>`;
    }
    return `${head}<div class="panel">${meta}</div>`;
  }

  const replayCtl = { timer: null, speed: 1, key: null };
  function stopReplay() { if (replayCtl.timer) { clearInterval(replayCtl.timer); replayCtl.timer = null; } replayCtl.key = null; const btn = $("[data-play]"); if (btn) btn.textContent = "▶"; }

  function creatureCard(c, prev, isPlayer) {
    const pct = c.maxHp ? Math.max(0, Math.min(100, (c.hp / c.maxHp) * 100)) : 0;
    const bpct = c.maxHp ? Math.min(100, (c.block / c.maxHp) * 100) : 0;
    const chg = (k) => prev && prev[k] !== c[k] ? "changed" : "";
    const powers = c.powers.map((p) => `<span class="power ${prev && !(prev.powers || []).some((q) => q.id === p.id && q.amount === p.amount) ? "changed" : ""}">${esc(human(p.id))} ${p.amount}</span>`).join("");
    return `<div class="creature ${c.alive ? "" : "dead"}"><div class="name"><b>${esc(c.name)}</b>${isPlayer ? "" : `<span class="intent ${chg("nextMove")}">${c.nextMove ? "意图 " + esc(human(c.nextMove)) : "—"}</span>`}</div><div class="hp"><div class="hpbar"><i style="width:${pct.toFixed(1)}%"></i>${c.block ? `<i class="block" style="width:${bpct.toFixed(1)}%"></i>` : ""}</div><span class="${chg("hp")}">${c.hp}/${c.maxHp}${c.block ? ` <span class="${chg("block")}">🛡 ${c.block}</span>` : ""}</span></div>${powers ? `<div class="powers">${powers}</div>` : ""}</div>`;
  }
  function pileBlock(name, cards, f, open) {
    return `<details class="pile" ${open ? "open" : ""}><summary>${name} <b>${cards.length}</b></summary><div class="chips">${cards.map((c) => cardChip(c, f)).join("") || `<span class="muted">空</span>`}</div></details>`;
  }

  async function pageReplay(route, f) {
    const id = route.parts[1], ci = parseInt(route.parts[2], 10) || 0, k = parseInt(route.parts[3], 10) || 0;
    let run = null;
    try { run = await loadRun(id); } catch (e) { return loadFail(id, f); }
    const cases = run && run.detail && run.detail.cases;
    if (!cases || !cases[ci] || !Array.isArray(cases[ci].steps)) return `<div class="empty">这一场没有回放数据（早于回放记录功能的运行） · <a href="${href("/run/" + id, f)}">返回运行记录</a></div>`;
    const c = cases[ci];
    const n = c.steps.length;
    const kk = Math.max(0, Math.min(n, k));
    const stateAt = (i) => i === 0 ? c.initial : c.steps[i - 1].state;
    const st = stateAt(kk), prev = kk > 0 ? stateAt(kk - 1) : null;
    const step = kk > 0 ? c.steps[kk - 1] : null;
    const multi = st.players.length > 1;
    const pTag = (a) => multi ? `P${(a.player || 0) + 1} ` : "";
    const api = step ? (step.action.player || 0) : 0;
    const me = st.players[api] || st.players[0], pme = prev ? (prev.players[api] || prev.players[0]) : null;
    const at = (i) => href(`/run/${id}/${ci}/${i}`, f);
    if (c.searches) { let si = -1, pos = 0; c.steps.forEach((s, i) => { if (s.search !== si) { si = s.search; pos = 0; } s.search_i = pos++; }); }
    const ticks = [`<a class="tick start ${kk === 0 ? "cur" : "done"} ${c.initialDiffs && c.initialDiffs.length ? "mismatch" : ""}" href="${at(0)}" data-focus="tick-0" aria-label="开局" data-tip="${esc(tipHead("开局") + tipRow(fmtUs(c.startMicros), "工作台开局"))}"></a>`]
      .concat(c.steps.map((s, i) => { const a = s.action; const label = `${pTag(a)}${a.kind === "play" ? `打出 ${human(a.card)}${a.target != null ? " → 敌 " + (a.target + 1) : ""}` : "结束回合"}`; return `<a class="tick ${a.kind} ${s.diffs.length ? "mismatch" : ""} ${i + 1 === kk ? "cur" : i + 1 < kk ? "done" : ""}" href="${at(i + 1)}" data-focus="tick-${i + 1}" aria-label="第 ${i + 1} 步 ${esc(label)}${s.diffs.length ? " 不一致" : ""}" data-tip="${esc(tipHead(`第 ${i + 1} 步 · 回合 ${s.state.players[0].turn}`) + tipRow(label, "") + tipRow(fmtUs(s.micros.wb), "工作台") + tipRow(fmtUs(s.micros.dev), "真实流程"))}"></a>`; })).join("");
    const tlLegend = `<div class="tl-legend"><span><i style="background:var(--axis)"></i>开局</span><span><i style="background:var(--seq-2)"></i>打出</span><span><i style="background:var(--s2)"></i>结束回合</span><span><i style="background:var(--critical)"></i>不一致</span><span class="muted">← → 逐步 · 空格 播放 · Home/End</span></div>`;
    let banner;
    if (kk === 0) banner = `<div class="banner ${c.initialDiffs.length ? "mismatch" : ""}">开局 · ${esc(human(c.encounter))} · 种子 ${esc(c.seed)}${c.initialDiffs.length ? " · 开局状态不一致" : ""}<span class="micros">工作台开局 ${fmtUs(c.startMicros)}</span></div>`;
    else {
      const a = step.action;
      const played = a.kind === "play" ? cardChip({ id: a.card, cost: pme.hand[a.hand] ? pme.hand[a.hand].cost : "", costsX: pme.hand[a.hand] ? pme.hand[a.hand].costsX : false, upgrade: a.upgrade }, f, "played") : "";
      const target = a.kind === "play" && a.target != null && prev.enemies[a.target] ? ` → ${esc(prev.enemies[a.target].name)}` : "";
      banner = `<div class="banner ${step.diffs.length ? "mismatch" : a.kind}">第 ${kk} 步 · 回合 ${me.turn} · ${pTag(a)}${a.kind === "play" ? `打出 ${played}${target}` : "结束回合 → 敌方回合 → 新回合"}${step.diffs.length ? " · 此步出现不一致" : ""}<span class="micros">工作台 ${fmtUs(step.micros.wb)} · 真实流程 ${fmtUs(step.micros.dev)}</span></div>`;
    }
    const rngRows = Object.entries(st.rng).map(([name, v]) => { const d = prev ? v.counter - prev.rng[name].counter : 0; return `<div><span>${esc(name)}</span><span><b>${v.counter}</b> <span class="d ${d ? "chg" : ""}">${d ? "+" + d : ""}</span></span></div>`; }).join("");
    const energyPips = (p) => Array.from({ length: Math.max(p.energy, 3) }, (_, i) => `<i class="${i < p.energy ? "" : "off"}"></i>`).join("");
    const pLabel = (i) => multi ? `P${i + 1} ` : "";
    const partyHtml = st.players.map((p, i) => { const pp = prev ? prev.players[i] : null; return `<div class="party"><div class="creatures">${creatureCard(p.creature, pp ? pp.creature : null, true)}</div><div class="stats" style="margin-top:8px"><span>${pLabel(i)}回合 <b>${p.turn}</b> · ${esc(p.phase)}</span><span>能量 <span class="energy ${pp && pp.energy !== p.energy ? "changed" : ""}">${energyPips(p)}</span> <b>${p.energy}</b></span>${p.stars ? `<span>星 <b>${p.stars}</b></span>` : ""}<span>金币 <b>${p.gold}</b></span><span>遗物 ${p.relics.map((r) => `<span class="power">${esc(human(r))}</span>`).join(" ")}</span></div></div>`; }).join("");
    const handsHtml = st.players.map((p, i) => { const pp = prev ? prev.players[i] : null; const hp = kk > 0 && step.action.kind === "play" && (step.action.player || 0) === i ? step.action.hand : -1; return `<div class="panel"><header><h2>${pLabel(i)}手牌</h2><div class="cap">${p.hand.length} 张 · 可打 ${p.playable.filter(Boolean).length}</div></header><div class="chips">${p.hand.map((cd, j) => cardChip(cd, f, p.playable[j] ? "" : "dim")).join("") || `<span class="muted">空</span>`}</div>${hp >= 0 && pp ? `<div class="cap" style="margin-top:8px">上一手牌：${pp.hand.map((cd, j) => cardChip(cd, f, j === hp ? "played" : "dim")).join("")}</div>` : ""}</div>`; }).join("");
    const pilesHtml = st.players.map((p, i) => `<div class="panel"><header><h2>${pLabel(i)}牌堆</h2></header><div class="piles">${pileBlock("抽牌堆（顶→底）", p.draw, f, false)}${pileBlock("弃牌堆", p.discard, f, false)}${pileBlock("消耗堆", p.exhaust, f, false)}${p.play.length ? pileBlock("打出中", p.play, f, true) : ""}</div></div>`).join("");
    const diffsHtml = (kk === 0 ? c.initialDiffs : step.diffs).map((d) => `<div class="id">${esc(d.path)}: 真实 <b>${esc(JSON.stringify(d.dev))}</b> · 工作台 <b>${esc(JSON.stringify(d.wb))}</b></div>`).join("");
    const search = kk > 0 && step.search != null && c.searches ? c.searches[step.search] : null;
    const searchHtml = search ? `<div class="panel"><header><h2>这一步来自搜索</h2><div class="cap">回合 ${search.turn} · 得分 ${fmt(search.score, 0)}${search.leaf === "estimate" ? ` · 估值叶 ${fmt(search.estimated, 0)} · 核实 ${search.verified} 条` : ""} · ${fmt(search.nodes)} 节点 · ${fmt(search.transpositions)} 置换命中 · ${fmt(search.micros / 1000, 0)} ms（快照 ${fmt(search.snapMicros / 1000, 0)} · 恢复 ${fmt(search.restoreMicros / 1000, 0)} · 动作 ${fmt(search.actMicros / 1000, 0)}）${search.exhausted ? " · 搜完" : " · 触及预算"}</div></header><div class="chips">${search.line.map((a, i) => `<span class="card ${i === step.search_i ? "played" : ""}">${pTag(a)}${a.kind === "play" ? esc(human(a.card)) + (a.target != null ? " → 敌 " + (a.target + 1) : "") : "结束回合"}</span>`).join("")}</div></div>` : "";
    const probes = (c.restores || []).length ? `<div class="panel"><header><h2>快照/恢复探针</h2><div class="cap">${c.restores.length} 次 · 绕行后恢复并继续核对</div></header><div class="tablewrap"><table><thead><tr><th>位置</th><th class="num">对象</th><th class="num">数组</th><th class="num">字段</th><th class="num">快照 µs</th><th class="num">恢复 µs</th><th>绕行</th><th>结果</th></tr></thead><tbody>${c.restores.map((r) => `<tr><td>${esc(r.at)}</td><td class="num">${fmt(r.objects)}</td><td class="num">${fmt(r.arrays)}</td><td class="num">${fmt(r.fields)}</td><td class="num">${fmt(r.snapMicros, 0)}</td><td class="num">${fmt(r.restoreMicros + r.resyncMicros, 0)}</td><td class="id">${r.detour.map((a) => pTag(a) + (a.kind === "play" ? human(a.card) : "结束回合")).map(esc).join(" › ")}${r.detourEnded ? " · 战斗结束" : ""}</td><td>${state(r.diffs.length > 0, 1)}</td></tr>`).join("")}</tbody></table></div></div>` : "";
    return `${crumbs([{ text: "总览", href: href("/", f) }, { text: "运行记录", href: href("/runs", f, { kind: "diff" }) }, { text: short(run.ts), href: href("/run/" + id, f) }, { text: `第 ${ci + 1} 场` }])}
      <div class="replay">
        <div class="replay-head"><div><h1>${esc(human(c.encounter))} <span class="id">${esc(c.encounter)} · 种子 ${esc(c.seed)}</span></h1><div class="cap"><span>${outcomeText[c.outcome] || ""} · ${n} 步 · ${c.turns ?? "?"} 回合 · 剩余 HP ${c.hpLeft ?? "?"}</span>${c.mismatches ? `<span class="state fail">${badIcon}${c.mismatches} 处不一致</span>` : `<span class="state pass">${okIcon}逐步一致</span>`}<a href="${href("/encounter/" + c.encounter, f)}">此遭遇的全部对局</a>${ci > 0 ? `<a href="${href(`/run/${id}/${ci - 1}/0`, f)}">‹ 上一场</a>` : ""}${ci + 1 < cases.length ? `<a href="${href(`/run/${id}/${ci + 1}/0`, f)}">下一场 ›</a>` : ""}</div></div>
          <div class="controls"><a class="btn" href="${at(0)}" data-focus="first" aria-label="开局" title="开局">⏮</a><a class="btn" href="${at(Math.max(0, kk - 1))}" data-focus="prev" aria-label="上一步" title="上一步 (←)">◀</a><button class="btn" data-play data-focus="play" aria-label="播放或暂停" title="播放/暂停 (空格)">${replayCtl.timer ? "⏸" : "▶"}</button><a class="btn" href="${at(Math.min(n, kk + 1))}" data-focus="next" aria-label="下一步" title="下一步 (→)">▶|</a><a class="btn" href="${at(n)}" data-focus="last" aria-label="结局" title="结局">⏭</a><span class="count" aria-live="polite">${kk} / ${n}</span><select data-speed data-focus="speed" aria-label="播放速度">${[0.5, 1, 2, 4].map((s) => `<option value="${s}" ${s === replayCtl.speed ? "selected" : ""}>${s}×</option>`).join("")}</select></div>
        </div>
        <div class="timeline">${ticks}</div>
        ${tlLegend}
        ${banner}
        ${diffsHtml ? `<div class="panel" style="border-color:var(--critical)"><header><h2>不一致</h2></header><div class="list">${diffsHtml}</div></div>` : ""}
        ${searchHtml}
        <div class="board">
          <div class="panel"><header><h2>敌方</h2><div class="cap">${st.side === "Enemy" ? "敌方回合" : "我方回合"} · 第 ${st.round} 轮</div></header><div class="creatures">${st.enemies.map((e, i) => creatureCard(e, prev ? prev.enemies[i] : null, false)).join("")}</div></div>
          <div class="panel"><header><h2>我方</h2><div class="cap">${multi ? `${st.players.length} 名玩家 · ` : ""}回合 ${me.turn} · ${esc(me.phase)}</div></header>${partyHtml}</div>
        </div>
        ${handsHtml}
        <div class="row2 even">
          ${pilesHtml}
          <div class="panel"><header><h2>RNG 计数器</h2><div class="cap">相对上一步的增量</div></header><div class="rng">${rngRows}</div></div>
        </div>
        ${probes}
      </div>`;
  }

  async function allDiffDetails(f) {
    const diffs = inWindow(inVersion(store.index, f).filter((r) => r.kind === "diff"), f).filter((r) => r.replay);
    const out = [];
    for (const d of diffs) { try { const run = await loadRun(d.id); if (run) out.push(run); } catch (e) { out.push(d); } }
    return out;
  }

  async function pageCards(route, f) {
    const D = derive(store.index, f);
    const models = await modelsFor(D);
    const pool = route.q.get("pool") || "IRONCLAD_CARD_POOL";
    const pools = [...new Set(models.cards.map((c) => c.pool))].sort();
    const items = models.cards.filter((c) => c.pool === pool);
    const tabs = pools.map((p) => `<a href="${href("/cards", f, { pool: p === "IRONCLAD_CARD_POOL" ? null : p })}" aria-current="${p === pool}">${esc(human(p.replace("_CARD_POOL", "")))}</a>`).join("");
    return `${filterBar(route, f)}<div class="panel"><header><h2>牌</h2><div class="cap"><span class="seg">${tabs}</span></div></header></div>${coverage("cards", esc(human(pool.replace("_CARD_POOL", ""))) + " 牌覆盖", items, D.cards, f, "card", cardTip, cardCols, modelsHint(models, "牌池"))}`;
  }
  async function pageEncounters(route, f) {
    const D = derive(store.index, f);
    const models = await modelsFor(D);
    return `${filterBar(route, f)}${coverage("encs", "遭遇覆盖", models.encounters, D.encounters, f, "encounter", encTip, encCols, modelsHint(models, "遭遇"))}`;
  }

  async function pageCard(route, f) {
    const id = route.parts[1];
    const D = derive(store.index, f);
    const models = await modelsFor(D);
    const model = models.cards.find((c) => c.id === id);
    const runs = await allDiffDetails(f);
    const plays = [];
    for (const run of runs) {
      const cases = (run.detail && run.detail.cases) || [];
      cases.forEach((c, ci) => (Array.isArray(c.steps) ? c.steps : []).forEach((s, si) => { if (s.action.kind === "play" && s.action.card === id) plays.push({ run, ci, si: si + 1, c, s }); }));
    }
    const rows = plays.slice().reverse().map((p) => `<tr><td class="muted"><a href="${href("/run/" + p.run.id, f)}">${short(p.run.ts)}</a></td><td class="id"><a href="${href("/encounter/" + p.c.encounter, f)}">${esc(p.c.encounter)}</a></td><td class="id">${esc(p.c.seed)}</td><td class="num">${p.s.state.players[0].turn}</td><td>${p.s.action.target != null && p.s.state.enemies[p.s.action.target] ? esc(p.s.state.enemies[p.s.action.target].name) : "—"}</td><td class="num">${fmtUs(p.s.micros.wb)}</td><td>${state(p.s.diffs.length > 0, 1)}</td><td><a class="btn" href="${href(`/run/${p.run.id}/${p.ci}/${p.si}`, f)}">回放此步</a></td></tr>`).join("");
    const stat = D.cards[id] || { n: 0, fail: false, cases: [] };
    return `${filterBar(route, f)}${crumbs([{ text: "总览", href: href("/", f) }, { text: "牌", href: href("/cards", f, { pool: model && model.pool !== "IRONCLAD_CARD_POOL" ? model.pool : null }) }, { text: id }])}<h1>${esc(human(id))}<span class="id">${esc(id)}</span></h1>
      <div class="row2"><div class="panel"><header><h2>模型</h2></header>${model ? kv([["牌池", esc(model.pool)], ["类型", esc(model.type)], ["稀有度", esc(model.rarity)], ["费用", model.costsX ? "X" : model.cost], ["目标", esc(model.target)]]) : `<span class="muted">当前版本的牌池快照里没有这张牌</span>`}</div><div class="panel"><header><h2>验证（窗口内）</h2></header>${kv([["打出并核对", `${stat.n} 次`], ["状态", state(stat.fail, stat.n)], ["有逐场记录的对局", `${stat.cases.length} 场`], ["有回放的打出", `${plays.length} 次`]])}</div></div>
      <div class="panel"><header><h2>每次打出</h2><div class="cap">窗口内 ${plays.length} 次有回放</div></header><div class="tablewrap"><table><thead><tr><th>时间</th><th>遭遇</th><th>种子</th><th class="num">回合</th><th>目标</th><th class="num">工作台耗时</th><th>一致性</th><th></th></tr></thead><tbody>${rows || `<tr><td colspan="8" class="empty">窗口内没有带回放的打出记录</td></tr>`}</tbody></table></div></div>`;
  }
  async function pageEncounter(route, f) {
    const id = route.parts[1];
    const D = derive(store.index, f);
    const models = await modelsFor(D);
    const model = models.encounters.find((e) => e.id === id);
    const st = D.encounters[id] || { n: 0, steps: 0, fail: false, cases: [] };
    const benches = D.benches.filter((b) => b.encounter === id);
    const rows = st.cases.slice().reverse().map((c) => `<tr><td class="muted"><a href="${href("/run/" + c.run, f)}">${short(c.ts)}</a></td><td class="id">${esc(c.seed)}</td><td class="num">${c.steps}</td><td>${outcomeText[c.outcome] || "–"}</td><td>${state(c.mismatches > 0, c.steps)}</td><td>${c.replay ? `<a class="btn" href="${href(`/run/${c.run}/${c.ci}/0`, f)}">回放</a>` : `<span class="muted">无回放数据</span>`}</td></tr>`).join("");
    const brows = benches.slice().reverse().map((b) => `<tr><td class="muted"><a href="${href("/run/" + b.id, f)}">${short(b.ts)}</a></td><td class="num">${b.rounds}</td><td class="num">${fmt(b.result.plays.median, 0)}</td><td class="num">${fmt((b.result.endTurns || {}).median, 0)}</td><td class="num">${fmt((b.result.starts || {}).median, 0)}</td></tr>`).join("");
    return `${filterBar(route, f)}${crumbs([{ text: "总览", href: href("/", f) }, { text: "遭遇", href: href("/encounters", f) }, { text: id }])}<h1>${esc(human(id))}<span class="id">${esc(id)}</span></h1>
      <div class="row2"><div class="panel"><header><h2>模型</h2></header>${model ? kv([["类型", esc(model.type)]]) : `<span class="muted">当前版本的遭遇快照里没有它</span>`}</div><div class="panel"><header><h2>验证</h2></header>${kv([["对局", `${st.n} 场`], ["步数", fmt(st.steps)], ["状态", state(st.fail, st.n)]])}</div></div>
      <div class="panel"><header><h2>对局</h2></header><div class="tablewrap"><table><thead><tr><th>时间</th><th>种子</th><th class="num">步数</th><th>结果</th><th>一致性</th><th></th></tr></thead><tbody>${rows || `<tr><td colspan="6" class="empty">窗口内没有对局</td></tr>`}</tbody></table></div></div>
      <div class="panel"><header><h2>Bench</h2><div class="cap">µs 中位</div></header><div class="tablewrap"><table><thead><tr><th>时间</th><th class="num">场数</th><th class="num">出牌</th><th class="num">结束回合</th><th class="num">开局</th></tr></thead><tbody>${brows || `<tr><td colspan="5" class="empty">窗口内没有 bench</td></tr>`}</tbody></table></div></div>`;
  }
  function pageInstances() {
    const st = store.status;
    if (!st) return `<div class="empty">快照里没有实例状态</div>`;
    const rows = st.instances.map((i) => `<tr><td class="id">${esc(i.name)}</td><td>${statusPill(i)}</td><td class="num">${i.pid ?? "–"}</td><td>${i.ready ? "是" : "否"}</td><td>${i.busy ? "是" : "否"}</td></tr>`).join("");
    return `<div class="panel"><header><h2>实例</h2><div class="cap">${esc(st.root || "")} · ${short(st.generatedAt)}</div></header><div class="tablewrap"><table><thead><tr><th>名称</th><th>状态</th><th class="num">PID</th><th>harness 就绪</th><th>执行中</th></tr></thead><tbody>${rows || `<tr><td colspan="5" class="empty">没有实例</td></tr>`}</tbody></table></div><p class="muted">wb = 工作台（TestMode，直驱规则），dev = 真实流程（oracle）。启动：<code>just headless start wb</code> / <code>just headless start dev</code>。</p></div>`;
  }

  let renderSeq = 0;
  async function render() {
    const route = parseHash();
    const f = filtersFrom(route.q);
    renderNav(route); renderStatus();
    const seq = ++renderSeq;
    const head = route.parts[0] || "";
    const replayKey = head === "run" && route.parts.length >= 4 ? `${route.parts[1]}/${route.parts[2]}` : null;
    if (!replayKey || replayCtl.key !== replayKey) stopReplay();
    const focusKey = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.focus : null;
    let html;
    try {
      if (head === "") html = await pageDash(route, f);
      else if (head === "runs") html = pageRuns(route, f);
      else if (head === "run" && route.parts.length >= 4) html = await pageReplay(route, f);
      else if (head === "run") html = await pageRun(route, f);
      else if (head === "cards") html = await pageCards(route, f);
      else if (head === "encounters") html = await pageEncounters(route, f);
      else if (head === "card") html = await pageCard(route, f);
      else if (head === "encounter") html = await pageEncounter(route, f);
      else if (head === "instances") html = pageInstances();
      else html = `<div class="empty">没有这个页面 · <a href="#/">回总览</a></div>`;
    } catch (e) { html = `<div class="empty">渲染失败：${esc(e.message)}</div>`; }
    if (seq !== renderSeq) return;
    const main = $("#main");
    main.innerHTML = html;
    bind(main, route, f);
    if (focusKey) { const el = main.querySelector(`[data-focus="${CSS.escape(focusKey)}"]`); if (el) el.focus({ preventScroll: true }); }
  }

  function bind(main, route, f) {
    const tables = tablesOf(route);
    main.querySelectorAll("[data-toggle]").forEach((btn) => {
      const id = btn.dataset.toggle;
      const apply = (showTable) => { const grid = document.getElementById(id + "-grid"), table = document.getElementById(id + "-table"); table.hidden = !showTable; grid.hidden = showTable; btn.textContent = showTable ? "图" : "表格"; btn.setAttribute("aria-pressed", String(showTable)); };
      apply(tables.has(id));
      btn.addEventListener("click", () => {
        if (tables.has(id)) tables.delete(id); else tables.add(id);
        apply(tables.has(id));
        const extra = { ...pageParams(route), tables: [...tables].join(",") || null };
        history.replaceState(null, "", href(route.path, f, extra));
      });
    });
    const vsel = main.querySelector("[data-version]");
    if (vsel) vsel.addEventListener("change", () => { location.hash = href(route.path, { ...f, version: vsel.value }, pageParams(route)); });
    const play = main.querySelector("[data-play]");
    if (play) play.addEventListener("click", () => { if (replayCtl.timer) { stopReplay(); play.textContent = "▶"; } else startReplay(route, f, play); });
    const speed = main.querySelector("[data-speed]");
    if (speed) speed.addEventListener("change", () => { replayCtl.speed = parseFloat(speed.value); if (replayCtl.timer) { stopReplay(); startReplay(route, f, play); } });
  }
  function startReplay(route, f, btn) {
    const id = route.parts[1], ci = route.parts[2];
    btn.textContent = "⏸";
    replayCtl.key = `${id}/${ci}`;
    replayCtl.timer = setInterval(() => {
      const r = parseHash(); if (r.parts[0] !== "run" || r.parts[1] !== id || r.parts[2] !== ci) { stopReplay(); return; }
      const k = parseInt(r.parts[3], 10) || 0;
      const run = store.runs.get(id); const n = run && run.detail && run.detail.cases[ci] ? run.detail.cases[ci].steps.length : 0;
      if (k >= n) { stopReplay(); return; }
      location.hash = href(`/run/${id}/${ci}/${k + 1}`, f);
    }, 900 / replayCtl.speed);
  }
  document.addEventListener("keydown", (e) => {
    const r = parseHash(); if (r.parts[0] !== "run" || r.parts.length < 4 || e.target.matches("input, select, textarea")) return;
    const f = filtersFrom(r.q); const k = parseInt(r.parts[3], 10) || 0;
    const run = store.runs.get(r.parts[1]); const n = run && run.detail && run.detail.cases[r.parts[2]] ? run.detail.cases[r.parts[2]].steps.length : 0;
    if (e.key === "ArrowLeft") { location.hash = href(`/run/${r.parts[1]}/${r.parts[2]}/${Math.max(0, k - 1)}`, f); e.preventDefault(); }
    else if (e.key === "ArrowRight") { location.hash = href(`/run/${r.parts[1]}/${r.parts[2]}/${Math.min(n, k + 1)}`, f); e.preventDefault(); }
    else if (e.key === " ") { const btn = $("[data-play]"); if (btn) btn.click(); e.preventDefault(); }
    else if (e.key === "Home") { location.hash = href(`/run/${r.parts[1]}/${r.parts[2]}/0`, f); e.preventDefault(); }
    else if (e.key === "End") { location.hash = href(`/run/${r.parts[1]}/${r.parts[2]}/${n}`, f); e.preventDefault(); }
  });

  const tip = $("#tip");
  const clearHot = () => document.querySelectorAll("svg g.hot").forEach((g) => g.classList.remove("hot"));
  function hideTip() { tip.style.display = "none"; clearHot(); }
  function showTip(t, cx, cy) {
    const g = t.closest("svg g"); if (g && (t.matches("a") || t.classList.contains("band"))) g.classList.add("hot");
    tip.innerHTML = t.dataset.tip; tip.style.display = "block";
    const w = tip.offsetWidth, h = tip.offsetHeight;
    tip.style.left = Math.min(cx + 14, window.innerWidth - w - 8) + "px";
    tip.style.top = (cy + 18 + h > window.innerHeight ? cy - h - 10 : cy + 18) + "px";
  }
  document.addEventListener("mousemove", (e) => { const t = e.target.closest && e.target.closest("[data-tip]"); clearHot(); if (!t) { tip.style.display = "none"; return; } showTip(t, e.clientX, e.clientY); });
  document.addEventListener("focusin", (e) => { const t = e.target.closest && e.target.closest("[data-tip]"); clearHot(); if (!t) { tip.style.display = "none"; return; } const r = t.getBoundingClientRect(); showTip(t, r.left + r.width / 2, r.top + r.height / 2); });
  document.addEventListener("focusout", hideTip);
  document.addEventListener("scroll", hideTip, true);
  document.addEventListener("mouseleave", hideTip);
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") hideTip(); });
  window.addEventListener("hashchange", render);

  async function poll() {
    let index = null, status = null;
    try { index = await fetchJson("data/index.json"); } catch (err) { index = null; }
    try { status = await fetchJson("data/status.json"); } catch (err) { status = null; }
    if (index) {
      const key = JSON.stringify([index.length, index.length ? index[index.length - 1].id : null, (status ? status.instances : []).map((i) => [i.name, i.alive, i.ready])]);
      const changed = key !== poll.last;
      poll.last = key; store.index = index; store.status = status;
      if (changed) render(); else renderStatus();
    } else if (!poll.last) { $("#main").innerHTML = `<div class="empty">监视服务失联 — 请确认 <code>just monitor</code> 在跑</div>`; }
    if (!index || !status) $("#status").innerHTML = `<span class="pill off"><i></i>${index ? "实例状态不可用" : "监视服务失联"}</span>`;
    setTimeout(poll, 3000);
  }
  if (store.live) poll(); else render();
})();
</script>
